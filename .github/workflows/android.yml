name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve GeckoView version
        id: gecko
        run: |
          set -euo pipefail
          META="$(curl -fsSL https://repo1.maven.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml)"
          VERSION="$(printf '%s' "$META" | grep -o '<version>[^<]*</version>' | tail -n 1 | sed 's/<[^>]*>//g')"
          if [ -z "$VERSION" ]; then VERSION="131.0.20240913135429"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "GeckoView $VERSION"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble
        working-directory: android
        run: gradle assembleDebug -PgeckoviewVersion=${{ steps.gecko.outputs.version }} --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: neverbrowser-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
